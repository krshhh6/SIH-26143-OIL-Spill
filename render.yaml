services:
  # -------------------------------------------------------------
  # 1. FRONTEND (React 19 + Vite + ONNX WebAssembly)
  # -------------------------------------------------------------
  - type: web
    name: spill-sense-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://spill-sense-backend.onrender.com

  # -------------------------------------------------------------
  # 2. BACKEND (FastAPI C2 Platform + Socket.IO)
  # -------------------------------------------------------------
  - type: web
    name: spill-sense-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROJECT_NAME
        value: "Spill Sense C2 Platform (SIH26143)"
      - key: API_V1_STR
        value: "/api/v1"
