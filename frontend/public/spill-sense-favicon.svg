<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A" />
      <stop offset="50%" stop-color="#0F1B33" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Radar Rings Gradient -->
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Primary Wave Gradient -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Secondary Wave Gradient -->
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Hydrocarbon Slick & Radar Flare -->
    <linearGradient id="beaconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Amber Alert Core -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.5" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Subtle Concentric Radar Coordinate Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#radarGrad)" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#radarGrad)" stroke-width="2" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="url(#radarGrad)" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Radar Crosshairs -->
  <line x1="256" y1="66" x2="256" y2="446" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="1.5" />
  <line x1="66" y1="256" x2="446" y2="256" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Radar Sweep Beam (Sector Wedge) -->
  <path d="M 256 256 L 390 122 A 190 190 0 0 0 256 66 Z" fill="url(#wave2)" fill-opacity="0.08" />

  <!-- Deep Ocean Swell Base (Lower Wave) -->
  <path d="M 96 340 C 140 310 190 320 230 345 C 270 370 320 375 360 345 C 390 322 405 325 416 335 C 416 350 405 385 370 405 C 320 435 250 435 180 410 C 130 392 104 365 96 340 Z" fill="#1E3A8A" fill-opacity="0.4" />

  <!-- Primary Dynamic Crest Wave -->
  <path d="M 92 310 C 140 260 200 280 246 312 C 290 342 344 346 384 316 C 410 296 422 298 426 304 C 424 330 395 366 352 386 C 304 408 236 404 176 376 C 130 354 102 332 92 310 Z" fill="url(#wave1)" />

  <!-- Upper Secondary Wave (Forward Drift Horizon) -->
  <path d="M 112 250 C 160 210 216 230 256 258 C 296 286 342 290 378 266 C 398 252 406 254 410 258 C 406 278 382 304 348 318 C 308 334 252 330 204 304 C 158 280 126 264 112 250 Z" fill="url(#wave2)" filter="url(#glow)" fill-opacity="0.9" />

  <!-- Center Satellite Radar / Hydrocarbon Slick Core Sensor -->
  <g transform="translate(256, 195)">
    <!-- Outer Cyan Sensor Halo -->
    <circle cx="0" cy="0" r="42" fill="#00E5FF" fill-opacity="0.15" filter="url(#glow)" />
    <!-- Radar Waveform Crest / Teardrop Beacon -->
    <path d="M 0 -36 C 22 -6 26 12 18 24 C 10 36 -10 36 -18 24 C -26 12 -22 -6 0 -36 Z" fill="url(#beaconGrad)" />
    <!-- Core Amber Hydrocarbon Detection Pin -->
    <circle cx="0" cy="14" r="9" fill="url(#amberGrad)" filter="url(#glow)" />
    <circle cx="0" cy="14" r="4" fill="#FFFFFF" />
  </g>

  <!-- Satellite Aperture Spark / Flare at Top-Right -->
  <g transform="translate(376, 136)">
    <circle cx="0" cy="0" r="5" fill="#38BDF8" filter="url(#glow)" />
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>
</svg>
